[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-trend-radar"
version = "0.1.0"
description = "A lightweight radar for AI research and engineering trends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.0,<3"]
dev = ["pytest>=8,<9"]

[project.scripts]
ai-trend-radar = "ai_trend_radar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trend_radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
