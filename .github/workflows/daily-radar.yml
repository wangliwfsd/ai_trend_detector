name: Daily AI Trend Radar

on:
  schedule:
    # 00:10 UTC = 08:10 Australia/Perth
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore rolling history
        uses: actions/cache/restore@v4
        with:
          path: |
            data/radar.db
            data/audio-cache
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -e '.[gemini]'

      - name: Build radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
        run: ai-trend-radar run --config config.example.yaml

      - name: Save rolling history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/radar.db
            data/audio-cache
          key: radar-db-${{ github.run_id }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-trend-radar-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
